<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffd27a">
<meta name="color-scheme" content="light">
<meta name="google" content="notranslate">
<title>Block World</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2363c24a'/%3E%3C/svg%3E">
<style>
  :root {
    --sat: constant(safe-area-inset-top);
    --sar: constant(safe-area-inset-right);
    --sab: constant(safe-area-inset-bottom);
    --sal: constant(safe-area-inset-left);
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --ink: #3a2a1c;
    --paper: #fff8ee;
    --leaf: #34a853;
    --leaf-d: #207a38;
    --sky: #3aa0e8;
    --coral: #ff6b57;
    --sun: #ffc53d;
    --line: #ead9c4;
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    height: 100vh; height: 100dvh;
    overflow: hidden; position: fixed; inset: 0;
    background: #8fd4ff;
    color: var(--ink);
    font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Heiti SC", "WenQuanYi Micro Hei", "Droid Sans Fallback", "Microsoft YaHei", sans-serif;
    touch-action: none;
    overscroll-behavior: none;
    color-scheme: light;
  }
  button { font: inherit; border: none; background: none; color: var(--ink); padding: 0; touch-action: none; cursor: pointer; -webkit-appearance: none; appearance: none; }
  button:focus-visible { outline: 3px solid #3aa0e8; outline-offset: 2px; }
  #app { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  body:not(.show-zh) .hint { display: none !important; }

  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
  #hud button, #hud #joy, #hud .hotbar, #hud .mid { pointer-events: auto; }

  .topbar {
    position: absolute;
    top: calc(6px + var(--sat));
    left: calc(8px + var(--sal));
    right: calc(8px + var(--sar));
    display: flex; gap: 8px; align-items: stretch;
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  #quest {
    flex: 1; min-width: 0; min-height: 56px;
    display: flex; align-items: center; gap: 8px;
    text-align: left;
    background: rgba(255,248,238,0.96);
    border-radius: 16px;
    padding: 4px 12px 4px 6px;
    box-shadow: 0 4px 0 rgba(58,42,28,0.12);
  }
  #quest canvas { width: 40px; height: 40px; flex: 0 0 auto; }
  .qtext { min-width: 0; display: flex; flex-direction: column; }
  #quest-en { font-size: 18px; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #quest .hint { display: block; font-size: 14px; font-weight: 700; color: #8a623c; line-height: 1.2; }
  .topbtn {
    min-width: 76px; height: 56px; padding: 0 12px;
    border-radius: 16px; background: #fff;
    font-size: 18px; font-weight: 800;
    box-shadow: 0 4px 0 rgba(58,42,28,0.14);
    flex: 0 0 auto;
  }
  .topbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(58,42,28,0.14); }
  #btn-craft { background: #b7f0c4; }
  #btn-words { background: #d9e4ff; }
  #btn-zh { background: #fff; }
  #btn-zh.on { background: #b7f0c4; }

  .bottom {
    position: absolute;
    left: calc(6px + var(--sal));
    right: calc(6px + var(--sar));
    bottom: calc(6px + var(--sab));
    display: flex; align-items: flex-end; gap: 8px;
    pointer-events: none;
  }
  .bottom > * { pointer-events: auto; }
  #joy { width: 124px; height: 124px; position: relative; flex: 0 0 auto; touch-action: none; }
  #joy-base {
    position: absolute; inset: 10px; border-radius: 50%;
    background: rgba(255,248,238,0.5);
    border: 3px solid rgba(58,42,28,0.16);
  }
  #joy-knob {
    position: absolute; width: 64px; height: 64px;
    left: 50%; top: 50%; margin: -32px 0 0 -32px;
    border-radius: 50%; background: #fff;
    box-shadow: 0 4px 0 rgba(58,42,28,0.18);
  }
  .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
  #held {
    pointer-events: none;
    background: rgba(255,248,238,0.96);
    border-radius: 14px;
    min-height: 36px;
    padding: 4px 12px;
    display: flex; align-items: baseline; gap: 8px;
    box-shadow: 0 3px 0 rgba(58,42,28,0.1);
    max-width: 100%;
  }
  #held-en { font-size: 18px; font-weight: 800; }
  #held .hint { font-size: 15px; font-weight: 700; color: #8a623c; }
  .hotbar {
    width: 100%; max-width: 100%;
    display: flex; gap: 6px; align-items: center;
    overflow-x: auto; overflow-y: hidden;
    padding: 2px 2px 4px;
    touch-action: pan-x;
    scrollbar-width: none;
    pointer-events: auto;
  }
  .hotbar::-webkit-scrollbar { display: none; }
  .slot {
    width: 58px; height: 58px; flex: 0 0 58px;
    border-radius: 14px; background: rgba(255,248,238,0.94);
    box-shadow: 0 3px 0 rgba(58,42,28,0.12);
    position: relative;
  }
  .slot canvas { width: 44px; height: 44px; display: block; margin: 4px auto 0; }
  .slot em {
    position: absolute; right: 3px; bottom: 2px;
    font-style: normal; font-size: 14px; font-weight: 800;
    background: rgba(255,255,255,0.9); border-radius: 8px; padding: 0 4px;
  }
  .slot.on { outline: 4px solid var(--coral); outline-offset: 0; }
  .emptybar {
    height: 58px; padding: 0 12px;
    display: flex; align-items: center; gap: 6px;
    color: var(--ink); font-weight: 800; font-size: 16px;
    background: rgba(255,248,238,0.7); border-radius: 14px;
    border: 2px dashed rgba(58,42,28,0.25);
  }
  .acts { display: flex; gap: 8px; flex: 0 0 auto; }
  .act {
    width: 74px; height: 74px; border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; line-height: 1.05;
    box-shadow: 0 4px 0 rgba(58,42,28,0.2);
  }
  .act strong { font-size: 16px; }
  .act .hint { font-size: 13px; font-weight: 800; opacity: 0.95; }
  .act:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(58,42,28,0.2); }
  .act.break { background: var(--coral); }
  .act.place { background: var(--sky); }
  .act.jump { background: var(--sun); color: var(--ink); }
  #btn-home {
    position: absolute; left: 50%;
    bottom: calc(148px + var(--sab));
    transform: translateX(-50%);
    z-index: 26; pointer-events: auto;
    min-width: 148px; min-height: 56px; padding: 6px 16px;
    border-radius: 18px; background: #fff;
    box-shadow: 0 4px 0 rgba(58,42,28,0.16);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #btn-home strong { font-size: 18px; }
  #btn-home .hint { font-size: 14px; color: #8a623c; font-weight: 700; }

  #wordcard {
    position: absolute; z-index: 60;
    left: 50%; top: calc(72px + var(--sat));
    transform: translateX(-50%);
    background: #fffaf2;
    border: 4px solid #ffc53d;
    border-radius: 28px;
    min-width: 200px;
    padding: 8px 22px 12px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(60,30,10,0.22);
    pointer-events: auto;
    animation: pop 0.18s ease-out;
  }
  #wordcard canvas { width: 68px; height: 68px; display: block; margin: 0 auto; }
  #card-en { font-size: clamp(42px, 6.4vw, 64px); font-weight: 900; line-height: 1; letter-spacing: -0.5px; }
  #card-zh { display: block; margin-top: 2px; font-size: 24px; font-weight: 800; color: #8a623c; font-style: normal; }
  @keyframes pop { from { transform: translateX(-50%) scale(0.86); } to { transform: translateX(-50%) scale(1); } }

  .panel {
    position: absolute; inset: 0; z-index: 50;
    background: #fff6e8;
    display: flex; flex-direction: column;
    padding: calc(8px + var(--sat)) calc(10px + var(--sar)) calc(8px + var(--sab)) calc(10px + var(--sal));
    touch-action: none;
  }
  .panel header { display: flex; align-items: center; gap: 10px; min-height: 60px; flex: 0 0 auto; }
  .panel h2 { margin: 0; flex: 1; font-size: 28px; line-height: 1.1; }
  .panel h2 .hint { font-size: 18px; font-weight: 700; color: #8a623c; margin-left: 8px; }
  .back {
    min-width: 104px; min-height: 56px; padding: 0 14px;
    border-radius: 16px; background: #fff; font-size: 20px; font-weight: 800;
    box-shadow: 0 4px 0 rgba(58,42,28,0.12);
  }
  .back:active { transform: translateY(3px); }
  .body { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding-bottom: 8px; }
  #recipes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
  .recipe {
    display: flex; align-items: center; gap: 6px;
    background: #fff; border-radius: 16px; padding: 8px;
    min-height: 92px;
    box-shadow: 0 3px 0 rgba(58,42,28,0.06);
  }
  .needs { display: flex; gap: 4px; flex: 1; min-width: 0; }
  .ing, .out { display: flex; flex-direction: column; align-items: center; min-width: 58px; }
  .ing canvas, .out canvas { width: 44px; height: 44px; }
  .ing b, .out b { font-size: 16px; line-height: 1.1; text-align: center; }
  .ing .hint, .out .hint { font-size: 13px; font-style: normal; color: #8a623c; font-weight: 700; }
  .ing em { font-style: normal; font-size: 16px; font-weight: 800; color: #c4503a; }
  .ing em.ok { color: #207a38; }
  .arrow { font-size: 22px; font-weight: 900; color: #c4a27a; flex: 0 0 auto; }
  .craftbtn {
    min-width: 84px; min-height: 64px; padding: 6px 8px;
    border-radius: 16px; background: #e7d7c4; color: #6d5a48;
    font-size: 18px; font-weight: 900; flex: 0 0 auto;
  }
  .craftbtn.ready { background: var(--leaf); color: #fff; box-shadow: 0 4px 0 var(--leaf-d); }
  .craftbtn:active { transform: translateY(2px); }
  #book-count { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
  #book-bar { height: 14px; border-radius: 999px; background: #ead9c4; overflow: hidden; margin: 0 0 10px; }
  #book-bar-fill { height: 100%; width: 0%; border-radius: 999px; background: #34a853; transition: width 0.3s ease; }
  #book-empty { font-size: 22px; font-weight: 800; line-height: 1.35; margin: 12px 4px; }
  #book-empty .hint { display: block; margin-top: 6px; font-size: 18px; color: #8a623c; }
  #wordgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .wcard {
    display: flex; align-items: center; gap: 8px;
    min-height: 76px; background: #fff; border-radius: 16px; padding: 6px;
    box-shadow: 0 3px 0 rgba(58,42,28,0.06);
  }
  .wcard canvas { width: 56px; height: 56px; flex: 0 0 auto; }
  .wcard .txt { flex: 1; min-width: 0; }
  .wcard .en { display: block; font-size: 22px; font-weight: 900; line-height: 1.1; }
  .wcard .hint { display: block; font-size: 16px; font-style: normal; color: #8a623c; font-weight: 700; }
  .spk {
    width: 56px; height: 56px; flex: 0 0 auto; border-radius: 50%;
    background: #ffe7a8; font-size: 26px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
  .spk:active { transform: scale(0.96); }

  #btn-speak {
    width: 56px; height: 56px; flex: 0 0 auto; border-radius: 50%;
    background: #ffe7a8;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(58,42,28,0.14);
  }
  #btn-speak:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(58,42,28,0.14); }
  #quest.quiz { background: #fff3c4; outline: 3px solid var(--sun); outline-offset: -3px; }
  #toast {
    position: absolute; z-index: 55;
    left: 50%; bottom: calc(158px + var(--sab));
    transform: translateX(-50%);
    background: rgba(255,250,242,0.97);
    border-radius: 16px; padding: 8px 18px;
    text-align: center; pointer-events: none;
    box-shadow: 0 6px 18px rgba(60,30,10,0.2);
    max-width: min(92vw, 520px);
  }
  #toast-en { font-size: 22px; font-weight: 900; display: block; line-height: 1.15; }
  #toast .hint { display: block; font-size: 16px; font-weight: 700; color: #8a623c; }
  #btn-quiz {
    width: 100%; min-height: 64px; margin: 0 0 10px;
    border-radius: 16px; background: var(--leaf); color: #fff;
    box-shadow: 0 4px 0 var(--leaf-d);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; line-height: 1.15;
  }
  #btn-quiz .hint { color: #eaffdf; font-size: 16px; }
  #btn-quiz:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--leaf-d); }
  .wcard .star { color: #f5a623; font-size: 20px; }

  #start {
    position: absolute; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    padding: calc(10px + var(--sat)) calc(16px + var(--sar)) calc(10px + var(--sab)) calc(16px + var(--sal));
    background: rgba(255, 236, 196, 0.18);
  }
  #start .card {
    width: min(440px, 100%);
    background: rgba(255,250,242,0.97);
    border-radius: 28px;
    padding: 16px 18px 14px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(60,30,10,0.18);
  }
  .brand { margin: 0; font-size: 40px; font-weight: 900; color: #2f7d3a; letter-spacing: -0.5px; line-height: 1; }
  #start h1 { margin: 4px 0 0; font-size: 22px; font-weight: 800; }
  .zh-always { margin: 2px 0 0; font-size: 18px; font-weight: 700; color: #8a623c; }
  #btn-start {
    margin-top: 12px; width: 100%; min-height: 88px;
    border-radius: 22px; background: #34a853; color: #fff;
    box-shadow: 0 5px 0 #207a38;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #btn-start:active { transform: translateY(3px); box-shadow: 0 2px 0 #207a38; }
  #btn-start .big { font-size: 30px; font-weight: 900; line-height: 1.1; }
  #btn-start .zh-always { color: #eaffdf; font-size: 20px; }
  .soundnote { margin: 8px 0 0; font-size: 15px; font-weight: 700; line-height: 1.3; color: #6d5340; }
  .soundnote .zh-always { font-size: 15px; }
  #save-note { margin: 6px 0 0; font-size: 16px; font-weight: 800; }
  #btn-new {
    margin-top: 8px; min-height: 56px; padding: 8px 14px;
    border-radius: 14px; background: #fff; font-size: 16px; font-weight: 800;
    box-shadow: 0 3px 0 rgba(58,42,28,0.1);
  }
  .desktop-hint { margin: 8px 0 0; font-size: 14px; color: #8a7360; font-weight: 700; }
  @media (pointer: coarse) { .desktop-hint { display: none; } }

  #rotate {
    display: none;
    position: absolute; inset: 0; z-index: 80;
    background: #ffe3b8;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: calc(24px + var(--sat)) calc(20px + var(--sar)) calc(24px + var(--sab)) calc(20px + var(--sal));
  }
  body.portrait #rotate { display: flex; }
  body.ok-portrait #rotate { display: none; }
  #rotate .big { margin: 16px 0 6px; font-size: 32px; font-weight: 900; line-height: 1.15; }
  #rotate .zh-always { font-size: 26px; }
  #btn-portrait {
    margin-top: 26px; min-height: 64px; padding: 10px 22px;
    border-radius: 18px; background: var(--leaf); color: #fff;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    box-shadow: 0 5px 0 var(--leaf-d);
  }
  #btn-portrait strong { font-size: 22px; font-weight: 900; line-height: 1.15; }
  #btn-portrait .zh-always { font-size: 17px; color: #eaffdf; }
  #btn-portrait:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--leaf-d); }
  .phone {
    width: 78px; height: 128px; border: 6px solid #3a2a1c; border-radius: 16px;
    background: #fff; position: relative;
    animation: turn 2.4s ease-in-out infinite;
  }
  .phone:before {
    content: ""; position: absolute; width: 28px; height: 5px; border-radius: 4px;
    background: #3a2a1c; top: 8px; left: 19px;
  }
  .phone:after {
    content: ""; position: absolute; left: 10px; right: 10px; top: 24px; bottom: 16px;
    border-radius: 6px; background: linear-gradient(#8fd4ff, #b7f0c4);
  }
  @keyframes turn {
    0%, 18% { transform: rotate(0deg); }
    42%, 70% { transform: rotate(90deg); }
    100% { transform: rotate(90deg); }
  }
  @media (orientation: portrait) {
    #rotate { display: flex; }
    body.ok-portrait #rotate { display: none; }
  }
  @media (max-width: 740px) {
    #joy { width: 108px; height: 108px; }
    #joy-knob { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
    .act { width: 64px; height: 64px; }
    .act strong { font-size: 15px; }
    .topbtn { min-width: 56px; padding: 0 6px; font-size: 15px; }
    #btn-speak { width: 46px; height: 46px; }
    #quest canvas { width: 34px; height: 34px; }
    #quest-en { font-size: 16px; }
    .brand { font-size: 34px; }
    #btn-start .big { font-size: 26px; }
  }
  [hidden] { display: none !important; }
  body.portrait .bottom { flex-wrap: wrap; }
  body.portrait .mid { order: 3; flex: 1 1 100%; }
  body.portrait #held { white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body class="show-zh">
<div id="app">
  <canvas id="view" width="800" height="400"></canvas>
  <div id="hud">
    <div class="topbar">
      <button id="quest" type="button">
        <canvas id="quest-icon" width="128" height="128"></canvas>
        <span class="qtext">
          <strong id="quest-en">Find a tree!</strong>
          <span id="quest-zh" class="hint">找到一棵树！</span>
        </span>
      </button>
      <button id="btn-speak" type="button" aria-label="Listen to the quest">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="#3a2a1c" d="M4 9h4l5-4v14l-5-4H4z"/><path fill="none" stroke="#3a2a1c" stroke-width="2" stroke-linecap="round" d="M16 9.2a4 4 0 0 1 0 5.6M18.2 7a7 7 0 0 1 0 10"/></svg>
      </button>
      <button id="btn-craft" class="topbtn" type="button">Craft</button>
      <button id="btn-words" class="topbtn" type="button">Words</button>
      <button id="btn-zh" class="topbtn on" type="button" aria-pressed="true">中文</button>
    </div>
    <button id="btn-home" type="button" hidden>
      <strong>Go home</strong>
      <span class="hint">回家</span>
    </button>
    <div class="bottom">
      <div id="joy" aria-label="Move">
        <div id="joy-base"></div>
        <div id="joy-knob"></div>
      </div>
      <div class="mid">
        <div id="held"><strong id="held-en">Tap a block</strong><span id="held-zh" class="hint">点方块</span></div>
        <div id="hotbar" class="hotbar"></div>
      </div>
      <div class="acts">
        <button id="btn-break" class="act break" type="button"><strong>Break</strong><span class="hint">挖</span></button>
        <button id="btn-place" class="act place" type="button"><strong>Place</strong><span class="hint">放</span></button>
        <button id="btn-jump" class="act jump" type="button"><strong>Jump</strong><span class="hint">跳</span></button>
      </div>
    </div>
  </div>

  <div id="wordcard" hidden role="status" aria-live="polite">
    <canvas id="card-icon" width="256" height="256"></canvas>
    <div id="card-en">Hello</div>
    <i id="card-zh" class="hint">你好</i>
  </div>

  <div id="toast" hidden role="status" aria-live="polite">
    <span id="toast-en"></span>
    <span id="toast-zh" class="hint"></span>
  </div>

  <div id="craft" class="panel" hidden>
    <header>
      <h2>Craft<span class="hint">制作</span></h2>
      <button id="craft-back" class="back" type="button">Back</button>
    </header>
    <div class="body" id="recipes"></div>
  </div>

  <div id="book" class="panel" hidden>
    <header>
      <h2>Word Book<span class="hint">单词本</span></h2>
      <button id="book-back" class="back" type="button">Back</button>
    </header>
    <div class="body">

      var dx = e.clientX - cx, dy = e.clientY - cy;
      var max = r.width * 0.32;
      var mag = Math.hypot(dx, dy) || 1;
      var cl = Math.min(mag, max);
      var nx = dx / mag * cl, ny = dy / mag * cl;
      knob.style.transform = 'translate(' + nx + 'px,' + ny + 'px)';
      joyX = nx / max;
      joyY = ny / max;
      if (joyY < -0.62 && !joyJumpLatch) { joyJumpLatch = true; requestJump(); }
      if (joyY > -0.25) joyJumpLatch = false;
    }
    function joyEnd(e) {
      if (joyId !== null && e.pointerId !== joyId) return;
      joyId = null; joyX = 0; joyY = 0; joyJumpLatch = false;
      knob.style.transform = 'translate(0px,0px)';
    }
    joy.addEventListener('pointerdown', function (e) {
      if (!started || rotateBlock() || panelOpen()) return;
      joyId = e.pointerId;
      joy.setPointerCapture(e.pointerId);
      e.preventDefault();
      joyPoint(e);
    });
    joy.addEventListener('pointermove', function (e) {
      if (e.pointerId !== joyId) return;
      joyPoint(e);
    });
    joy.addEventListener('pointerup', joyEnd);
    joy.addEventListener('pointercancel', joyEnd);
    window.addEventListener('keydown', function (e) {
      if (e.code === 'Escape') { closePanels(); return; }
      if (!started || rotateBlock()) return;
      if (e.code === 'KeyE') { if (panelOpen()) closePanels(); else openCraft(); e.preventDefault(); return; }
      if (e.code === 'KeyB') { if (document.getElementById('book').hidden) openBook(); else closeBook(); e.preventDefault(); return; }
      keys[e.code] = 1;
      if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'ArrowUp' || e.code === 'Space') e.preventDefault();
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') requestJump();
      if (e.code === 'KeyX' || e.code === 'KeyJ') doBreak();
      if (e.code === 'KeyC' || e.code === 'KeyK' || e.code === 'KeyF') doPlace();
      if (/^Digit[1-8]$/.test(e.code)) {
        var n = +e.code.slice(5) - 1;
        if (hotbar[n]) { sel = n; invSig = ''; showWord(hotbar[n]); }
      }
    });
    window.addEventListener('keyup', function (e) { delete keys[e.code]; });
    window.addEventListener('blur', function () { keys = {}; joyX = 0; });
    document.addEventListener('touchmove', function (e) {
      var t = e.target;
      if (t && t.closest && t.closest('.body, .hotbar')) return;
      e.preventDefault();
    }, { passive: false });
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
      document.addEventListener(ev, function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
    });
    document.addEventListener('selectstart', function (e) { e.preventDefault(); });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); });
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () { setTimeout(resize, 60); setTimeout(resize, 350); });
    if (window.screen && screen.orientation && screen.orientation.addEventListener) {
      screen.orientation.addEventListener('change', function () { setTimeout(resize, 60); });
    }
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    if (window.speechSynthesis) {
      try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = function () { pickVoice(); }; } catch (err) { /* ignore */ }
    }
  }

  function tick(dt, sec) {
    lockAge += dt;
    if (cardLeft > 0) {
      cardLeft -= dt;
      if (cardLeft <= 0) hideCard();
    }
    if (toastLeft > 0) {
      toastLeft -= dt;
      if (toastLeft <= 0) document.getElementById('toast').hidden = true;
    }
    var playing = started && !rotateBlock() && !panelOpen();
    if (playing) {
      rainTimer -= dt;
      if (rainTimer <= 0) {
        rainOn = !rainOn && nightFactor(timeOfDay) < 0.6;
        rainTimer = rainOn ? (10 + Math.random() * 7) : (30 + Math.random() * 28);
      }
      if (nightFactor(timeOfDay) >= 0.6 && rainOn) { rainOn = false; rainTimer = 24; }
      timeOfDay = (timeOfDay + dt / DAY_LEN) % 1;
      var left = Math.min(dt, 0.05);
      while (left > 0) {
        var h = Math.min(0.008, left);
        physics(h);
        left -= h;
      }
      var i;
      for (i = 0; i < animals.length; i++) animalStep(animals[i], dt);
      for (i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];
        p.age += dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 80 * dt;
        if (p.age >= p.life) parts.splice(i, 1);
      }
      if (fishing) {
        fishing.t += dt;
        var fdx = fishing.x - player.x, fdy = fishing.y - player.y;
        if (fdx * fdx + fdy * fdy > (4.5 * TILE) * (4.5 * TILE)) fishing = null;
        else if (fishing.t >= fishing.bite) catchFish();
      }
      var ci2;
      for (ci2 = crops.length - 1; ci2 >= 0; ci2--) {
        var cp = crops[ci2];
        var cid = get(cp.tx, cp.ty);
        if (cid !== WHEAT1 && cid !== WHEAT2 && cid !== WHEAT3) { crops.splice(ci2, 1); continue; }
        cp.age += dt;
        var wantStage = cp.age < 14 ? WHEAT1 : (cp.age < 28 ? WHEAT2 : WHEAT3);
        if (cid !== wantStage) setCell(cp.tx, cp.ty, wantStage);
        if (wantStage === WHEAT3 && !progress.wheatRipe && !quiz) {
          progress.wheatRipe = 1;
          showWord('wheat');
          updateQuest();
          saveSoon();
        }
      }
      if (riding && boat) {
        var axb = axis();
        if (axb) player.dir = axb;
        var nxb = boat.x + axb * 175 * dt;
        if (waterTopAt(nxb) !== null) boat.x = nxb;
        var topc = waterTopAt(boat.x);
        if (topc !== null) boat.y += (topc - boat.y) * Math.min(1, dt * 8);
        player.x = boat.x;
        player.y = boat.y + 4;
        player.vy = 0;
        boatPhase += dt * (axb ? 6 : 2);
      }
      if (inWater() && !progress.water && !quiz) {
        progress.water = 1;
        learn('water');
        showWord('water');
        updateQuest();
        saveSoon();
      }
      var swimNow = !riding && inWater();
      if (swimNow) {
        swimPhase += dt * (axis() ? 10 : 5);
        splashT -= dt;
        if (!wasSwim) { splash(11, true); splashT = 0.22; }
        else if (splashT <= 0) { splash(axis() ? 3 : 1, false); splashT = axis() ? 0.16 : 0.42; }
      }
      wasSwim = swimNow;
      if (quiz && quizNear()) quizWin();
      var depth = Math.floor((player.y - 2) / TILE);
      if (depth >= GROUND + 4) deepTime += dt;
      else deepTime = 0;
      document.getElementById('btn-home').hidden = !(deepTime > 1.15);
      if (dirtySave) {
        saveIn -= dt;
        if (saveIn <= 0) { save(); saveIn = 2.5; }
      }
    }
    updateCamera(playing ? dt : 1);
    if (invSignature() !== invSig) renderHotbar();
    drawFrame(sec);
  }

  function boot() {
    buildSprites();
    bind();
    resize();
    var saved = loadRaw();
    if (saved) {
      applySave(saved);
      document.getElementById('save-note').hidden = false;
      document.getElementById('btn-new').hidden = false;
    } else {
      var hashSeed = /seed=(\d+)/.exec(location.hash || '');
      freshGame(hashSeed ? (+hashSeed[1] | 0) : ((Math.floor(Math.random() * 900000) + 21) | 0));
    }
    renderRecipes();
    renderHotbar();
    updateQuest();
    updateCamera(1);
    drawFrame(0);
    requestAnimationFrame(function loop(ts) {
      requestAnimationFrame(loop);
      var dt = Math.min(0.05, lastTs ? (ts - lastTs) / 1000 : 0.016);
      lastTs = ts;
      fpsN++;
      if (ts - fpsT > 500) { fps = Math.round(fpsN * 1000 / (ts - fpsT)); fpsN = 0; fpsT = ts; }
      if (document.hidden) return;
      try { tick(dt, ts / 1000); }
      catch (err) {
        frameErr = String(err && err.stack || err);
        console.error(err);
      }
    });
    window.BW = {
      ready: true,
      setTime: function (t) { timeOfDay = ((t % 1) + 1) % 1; },
      getTime: function () { return timeOfDay; },
      animals: function () { return animals.map(function (a) { return { type: a.type, x: a.x, y: a.y }; }); },
      player: function () { return { x: player.x, y: player.y, onGround: onGround, dir: player.dir }; },
      worldToScreen: worldToScreen,
      words: function () { return learned.slice(); },
      quiz: function () { return quiz ? quiz.key : ''; },
      stars: function () { return Object.keys(quizStars); },
      startQuiz: function () { return startQuiz(); },
      endQuiz: function () { endQuiz(); },
      speakTask: function () { speakTask(); },
      inv: function () { return JSON.parse(JSON.stringify(inv)); },
      quest: function () { return document.getElementById('quest-en').textContent; },
      card: function () {
        return document.getElementById('wordcard').hidden ? '' : document.getElementById('card-en').textContent;
      },
      cardZh: function () {
        return document.getElementById('wordcard').hidden ? '' : document.getElementById('card-zh').textContent;
      },
      find: function (id) {
        var px = Math.floor(player.x / TILE), py = Math.floor((player.y - 8) / TILE);
        var best = null, bd = 1e9, x, y;
        for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
          if (cells[idx(x, y)] !== id) continue;
          var d = (x - px) * (x - px) + (y - py) * (y - py);
          if (d < bd) { bd = d; best = { tx: x, ty: y, wx: (x + 0.5) * TILE, wy: (y + 0.5) * TILE }; }
        }
        return best;
      },
      screenAnimal: function (type) {
        var i, best = null, bd = 1e15;
        for (i = 0; i < animals.length; i++) {
          if (animals[i].type !== type) continue;
          var s = worldToScreen(animals[i].x, animals[i].y - 16);
          if (s.x > 20 && s.x < viewW - 20 && s.y > 20 && s.y < viewH - 20) return s;
          var d = Math.abs(s.x - viewW / 2) + Math.abs(s.y - viewH / 2);
          if (d < bd) { bd = d; best = s; }
        }
        return best;
      },
      hideCard: hideCard,
      place: function (key, tx, ty) {
        if (!BLOCK_OF[key]) return false;
        if (!inv[key]) addItem(key, 1, true);
        sel = hotbar.indexOf(key);
        invSig = '';
        tryPlace(tx, ty);
        return get(tx, ty) === BLOCK_OF[key];
      },
      questIndex: function () { return questIndex(); },
      hasHat: function () { return hasHat(); },
      ch3: function () {
        return {
          qi: questIndex(), fish: progress.fish || 0, wheatRipe: progress.wheatRipe || 0,
          boatRide: progress.boatRide || 0, petFlag: progress.pet || 0, pack: hasPack(),
          pet: animals.filter(function (a) { return a.tamed; }).map(function (a) { return a.type; }),
          boat: boat ? { x: Math.round(boat.x), y: Math.round(boat.y) } : null,
          riding: riding, fishing: !!fishing,
          crops: crops.map(function (c) { return [c.tx, c.ty, Math.round(c.age)]; })
        };
      },
      give: function (key, n) { addItem(key, n || 1, true); invSig = ''; renderHotbar(); },
      select: function (key) { var i = hotbar.indexOf(key); if (i >= 0) { sel = i; invSig = ''; renderHotbar(); } return sel; },
      board: function () { boardBoat(); },
      grow: function () { crops.forEach(function (c) { c.age = 99; }); },
      saveNow: function () { save(); },
      rain: function () { return rainOn; },
      setRain: function (on) { rainOn = !!on; rainTimer = on ? 999 : 999; },
      totalWords: function () { return Object.keys(WORD).length; },
      fps: function () { return fps; },
      error: function () { return frameErr; },
      layout: function () {
        return { viewW: viewW, viewH: viewH, tileScreen: tileScreen, dpr: dpr, portrait: portrait, started: started };
      },
      seed: function () { return seed; }
    };
  }
  boot();
})();
</script>
