<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Animal Park</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;font-family:-apple-system,"SF Pro Rounded","Helvetica Neue",Arial,sans-serif;background:#fff6dc;color:#3a2a14;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;padding:0;background:none}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto}
.scr.on{display:flex}
.big{font-size:30px;font-weight:800;padding:20px 46px;border-radius:999px;background:#ff8a3d;color:#fff;box-shadow:0 6px 0 #c95f1c}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c95f1c}
.soft{font-size:22px;font-weight:700;padding:14px 28px;border-radius:999px;background:#fff;box-shadow:0 4px 0 #e2cf9a}
/* ---------- home ---------- */
#home{justify-content:center;gap:22px;text-align:center}
#home h1{font-size:44px;margin:0}
.logo{font-size:92px;line-height:1}
.logo span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.logo span:nth-child(2){animation-delay:.3s}.logo span:nth-child(3){animation-delay:.6s}
#nomic{display:none;font-size:19px;font-weight:700;background:#fff;border-radius:16px;padding:10px 16px}
#gear{position:absolute;right:14px;top:calc(10px + env(safe-area-inset-top));font-size:24px;opacity:.35;padding:10px}
/* ---------- play ---------- */
#bar{width:100%;display:flex;align-items:center;justify-content:space-between;height:48px}
#exit{font-size:24px;opacity:.4;padding:8px 12px}
#dots{display:flex;gap:6px}
#dots i{width:10px;height:10px;border-radius:50%;background:#e2cf9a}
#dots i.done{background:#ff8a3d}
#bookIco{font-size:32px;padding:4px 8px}
#stage{position:relative;width:100%;flex:1 1 auto;min-height:230px;max-height:58vh;border-radius:28px;overflow:hidden;box-shadow:0 6px 0 #e2cf9a;transition:background .8s;font-size:60px}
.bg-grass{background:linear-gradient(#9fdcff 0 55%,#8fd66b 55% 100%)}
.bg-pond{background:linear-gradient(#9fdcff 0 45%,#8fd66b 45% 62%,#4db4e8 62% 100%)}
.bg-sky{background:linear-gradient(#58b8ff,#c8ecff)}
.bg-sea{background:linear-gradient(#2c8fd6,#0d4f8f)}
.bg-ice{background:linear-gradient(#cfeaff 0 55%,#f4fbff 55% 100%)}
.bg-night{background:linear-gradient(#1b2452,#48407a)}
.bg-dawn{background:linear-gradient(#ffc27a 0 55%,#8fd66b 55% 100%)}
.bg-party{background:linear-gradient(#ffb3d9,#ffe08a)}
.actor{position:absolute;line-height:1;transform:translate(-50%,-50%) rotate(var(--r,0deg));transition:left var(--d,.7s) ease-in-out,top var(--d,.7s) ease-in-out,font-size var(--d,.7s) ease,opacity .4s,transform var(--d,.7s) ease,filter .6s;will-change:left,top}
.actor .in{display:inline-block}
.actor.pop .in{animation:pop .45s ease-out}
.bub{position:absolute;left:50%;bottom:100%;translate:-50% 0;background:#fff;border-radius:16px;padding:4px 12px;font-size:22px;font-weight:800;white-space:nowrap;color:#3a2a14;animation:pop .3s ease-out;z-index:5}
#cap{position:absolute;left:8px;right:8px;top:8px;background:rgba(255,255,255,.92);border-radius:16px;padding:8px 12px;font-size:20px;font-weight:700;text-align:center;display:none;z-index:9}
.an-jump{animation:jump .6s ease-out 2}
.an-shake{animation:shake .5s linear 2}
.an-spin{animation:spin .8s ease-in-out}
.an-wob{animation:wob .9s ease-in-out}
.an-bounce{animation:jump .45s ease-out 5}
.an-pulse{animation:pulse .5s ease-in-out 3}
.an-sit{animation:sit 1.6s ease-in-out}
.an-talk{animation:talk .32s ease-in-out infinite}
.an-dance{animation:dance .6s ease-in-out infinite}
.an-rainbow{animation:rainbow 1.2s linear infinite}
.an-wave{animation:wob .5s ease-in-out 4}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-70%) scaleY(1.08)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-12%)}75%{transform:translateX(12%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wob{0%,100%{transform:rotate(0)}30%{transform:rotate(-22deg)}70%{transform:rotate(16deg)}}
@keyframes pulse{50%{transform:scale(1.3)}}
@keyframes sit{0%,100%{transform:scaleY(1)}20%,80%{transform:scaleY(.72) translateY(18%)}}
@keyframes talk{50%{transform:scaleY(1.1) translateY(-4%)}}
@keyframes dance{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(14deg) translateY(-18%)}}
@keyframes rainbow{from{filter:sepia(1) saturate(8) hue-rotate(0deg)}to{filter:sepia(1) saturate(8) hue-rotate(360deg)}}
.conf{position:absolute;top:-12%;font-size:.45em;animation:fall 1.8s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(700%) rotate(540deg);opacity:.2}}
/* hint row: icons only (B2) + R-card crib */
#hint{min-height:64px;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}
#hint .ic{font-size:36px;background:#fff;border-radius:18px;padding:6px 12px;box-shadow:0 3px 0 #e2cf9a;animation:pop .35s ease-out}
#hint .ic.demo{outline:4px solid #ff8a3d}
#hint .crib{font-size:24px;font-weight:800;background:#fff;border-radius:16px;padding:8px 16px}
#ctl{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:6px;position:relative;width:100%}
#mic{width:104px;height:104px;border-radius:50%;font-size:50px;background:#ff8a3d;box-shadow:0 6px 0 #c95f1c;transition:opacity .2s,background .2s}
#mic[disabled]{opacity:.3}
#mic.ready{animation:pulse 1.2s ease-in-out infinite}
#mic.live{background:#e5383b;box-shadow:0 0 0 12px rgba(229,56,59,.25);animation:pulse .8s ease-in-out infinite}
#again{font-size:30px;width:60px;height:60px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #e2cf9a}
#again[disabled]{opacity:.3}
#keys{display:none;gap:12px;margin-top:10px;width:100%;justify-content:center}
#keys.on{display:flex}
#skip{font-size:20px;font-weight:800;padding:12px 22px;border-radius:999px;background:#fff;box-shadow:0 3px 0 #e2cf9a}
#heard{position:relative;overflow:hidden;font-size:18px;font-weight:800;padding:12px 18px;border-radius:999px;background:#d9f2d0;box-shadow:0 3px 0 #a9d39a}
#heard b{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(60,160,60,.4)}
#heard.hold b{width:100%;transition:width 1s linear}
#heard span{position:relative}
#fly{position:fixed;font-size:64px;z-index:50;pointer-events:none;display:none;line-height:1}
/* ---------- book / end / parent ---------- */
#book,#end{justify-content:flex-start;gap:14px;text-align:center}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;overflow:auto;padding:4px}
#grid div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:34px;background:#fff;border-radius:16px;filter:grayscale(1);opacity:.28}
#grid div.lit{filter:none;opacity:1}
#grid div.shiny{background:linear-gradient(135deg,#fff3b0,#ffd166,#fff3b0);box-shadow:0 0 12px #ffc93c}
#end{justify-content:center}
#end h2{font-size:38px;margin:0}
#endRow{font-size:38px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:46px}
#endRow .new{animation:pulse 1s ease-in-out infinite}
.stat{font-size:26px;font-weight:800}
.stat b{font-size:44px;color:#ff8a3d}
#parent{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99}
#parent.on{display:flex}
#parent .box{background:#fff;border-radius:22px;padding:22px;width:min(88vw,360px);display:flex;flex-direction:column;gap:12px;font-size:17px}
#parent .box button{padding:14px;border-radius:14px;background:#f1ead6;font-weight:700;font-size:17px}
#parent textarea{width:100%;height:110px;display:none;font-size:11px;-webkit-user-select:text;user-select:text}
#pmsg{min-height:20px;font-size:14px;color:#2a7d2a}
</style>
</head>
<body>

<!-- home -->
<section id="home" class="scr on">
  <button id="gear" aria-label="Parents">⚙️</button>
  <div class="logo"><span>🐶</span><span>🤠</span><span>🐘</span></div>
  <h1>Animal Park</h1>
  <button id="start" class="big">▶ Start</button>
  <button id="openBook" class="soft">📒 Stickers</button>
  <div id="nomic">🎤❌ No microphone here.<br>Play with a grown-up!</div>
</section>

<!-- play -->
<section id="play" class="scr">
  <div id="bar"><button id="exit" aria-label="Exit">✖</button><div id="dots"></div><div id="bookIco">📒</div></div>
  <div id="stage" class="bg-grass"><div id="cap"></div></div>
  <div id="hint"></div>
  <div id="ctl">
    <button id="again" aria-label="Listen again">🔊</button>
    <button id="mic" aria-label="Talk" disabled>🎤</button>
    <span style="width:60px"></span>
  </div>
  <div id="keys">
    <button id="skip">⏭ Skip</button>
    <button id="heard"><b></b><span>👂 I heard it (hold)</span></button>
  </div>
</section>

<!-- sticker book -->
<section id="book" class="scr">
  <h2 style="margin:6px 0;font-size:32px">📒 My Stickers</h2>
  <div id="grid"></div>
  <button id="closeBook" class="soft">⬅ Back</button>
</section>

<!-- end -->
<section id="end" class="scr">
  <h2>🎉 Great job!</h2>
  <div class="stat">You spoke <b id="nSpoke">0</b> times!</div>
  <div class="stat"><b id="nStick">0</b> stickers</div>
  <div id="endRow"></div>
  <button id="replay" class="big">▶ Play again</button>
  <button id="toHome" class="soft">🏠 Home</button>
</section>

<!-- parent menu (二级菜单，中文) -->
<div id="parent"><div class="box">
  <b>家长菜单</b>
  <button id="pCopy">📋 复制日志</button>
  <button id="pReset">🗑 重置进度（贴纸清空）</button>
  <div id="pmsg"></div>
  <textarea id="pText" readonly></textarea>
  <button id="pClose">关闭</button>
</div></div>
<div id="fly"></div>

<script>
'use strict';
/* =====================================================================
   Animal Park — speaking cards prototype (single file, no dependencies)
   Flow: home → draw deck → say prompt → mic → tier (A/B/C) → result
         animation → reply → sticker → next card → end
   ===================================================================== */

// ---------- small helpers ----------
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => timers.push(setTimeout(r, ms)));
let timers = [];                       // every pending timeout, cleared on exit
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

// ---------- storage (never throws: private mode / quota) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const K_PROG = 'sc_prog_v1', K_LOG = 'sc_log_v1';
// prog: st = stickers {cardId: 1 lit | 2 shiny}, last = last outcome key per card, plays = pass count per card
let prog = store.get(K_PROG, null) || { st: {}, last: {}, plays: {} };
const saveProg = () => store.set(K_PROG, prog);

// ---------- local log: one line per attempt ----------
function logTry(card, tier, heard, ms, res) {
  const log = store.get(K_LOG, []);
  log.push({ t: new Date().toISOString(), card, tier, said: heard[0] || '', alts: heard.slice(1), ms, res: res || '' });
  store.set(K_LOG, log.slice(-3000));
}
function logText() {
  const log = store.get(K_LOG, []);
  const head = 'time\tcard\ttier\ttranscript\talternatives\tms\tresult';
  return [head].concat(log.map(e => [e.t, e.card, e.tier, e.said, (e.alts || []).join(' | '), e.ms, e.res].join('\t'))).join('\n');
}

// ---------- matching: case-insensitive, punctuation ignored, synonyms ----------
const SYN = { bunny: 'rabbit', bunnies: 'rabbit', kitty: 'cat', kitten: 'cat', doggy: 'dog', doggie: 'dog', puppy: 'dog' };
// al = per-card misrecognition whitelist {misheardToken: keyword}, filled in from the probe page results
const norm = (s, al) => String(s || '').toLowerCase().replace(/[^a-z' ]+/g, ' ').replace(/'/g, '').trim().split(/\s+/).filter(Boolean).map(t => SYN[t] || (al && al[t]) || t);
// token vs keyword: exact, plural, -ing (jumping / running)
const tokIs = (t, k) => t === k || t === k + 's' || t === k + 'es' || t === k + 'ing' || t === k + k.slice(-1) + 'ing';
// does one normalized transcript contain keyword (single word or phrase like "get up")?
function hasKw(toks, kw) {
  const ks = kw.split(' ');
  for (let i = 0; i + ks.length <= toks.length; i++) {
    if (ks.every((k, j) => tokIs(toks[i + j], k))) return true;
  }
  return false;
}
// all keywords found, in order of appearance in each alternative (top alternative first)
function findKws(heard, kws, al) {
  const hits = [];
  heard.forEach(h => {
    const toks = norm(h, al);
    kws.filter(k => hasKw(toks, k))
       .sort((a, b) => toks.findIndex(t => tokIs(t, a.split(' ')[0])) - toks.findIndex(t => tokIs(t, b.split(' ')[0])))
       .forEach(k => { if (!hits.includes(k)) hits.push(k); });
  });
  return hits;
}

// ---------- TTS: en-US, rate 0.9; resolves when finished (or failed) ----------
const synth = window.speechSynthesis || null;
let ttsFailed = !synth || typeof window.SpeechSynthesisUtterance !== 'function';
function unlockTTS() {                 // iOS: first speak must sit inside a tap
  if (ttsFailed) return;
  try { synth.speak(new SpeechSynthesisUtterance(' ')); } catch (e) { ttsFailed = true; }
}
function speak(text, o) {
  o = o || {};
  showCap(ttsFailed ? text : '');      // caption only when there is no voice
  if (ttsFailed) return sleep(900 + text.length * 55);
  return new Promise(res => {
    let done = false;
    const fin = bad => { if (done) return; done = true; if (bad) showCap(text); res(); };
    try {
      if (synth.speaking || synth.pending) synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = o.rate || 0.9; u.pitch = o.pitch || 1;
      const v = (synth.getVoices() || []).find(v => /^en[-_]US/i.test(v.lang));
      if (v) u.voice = v;
      u.onend = () => fin(false);
      u.onerror = ev => fin(ev && ev.error !== 'interrupted' && ev.error !== 'canceled');
      synth.speak(u);
      timers.push(setTimeout(() => fin(false), 2500 + text.length * 110));   // watchdog: onend sometimes never fires on iOS
    } catch (e) { ttsFailed = true; fin(true); }
  });
}
const hush = () => { try { if (synth) synth.cancel(); } catch (e) {} };

// ---------- speech recognition: tap to start, silence ends it ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let micOK = !!SR;                      // false → whole round runs on parent confirm
let rec = null;
/* listen(isMatch, waitAll) → Promise<{heard:[...], err}>
   heard = every alternative of every result, top first, deduped.
   Ends on: keyword match (+0.6 s grace), 1.6 s silence after speech,
   5 s with no speech at all, or a 12 s hard cap. */
function listen(isMatch, waitAll) {
  return new Promise(res => {
    const heard = []; let done = false, err = '', tSil = 0, tHit = 0;
    const fin = () => {
      if (done) return; done = true;
      [tNone, tCap, tSil, tHit].forEach(clearTimeout);
      try { r.onresult = r.onerror = r.onend = null; r.abort(); } catch (e) {}
      rec = null; res({ heard, err });
    };
    const stop = () => { try { r.stop(); } catch (e) {} timers.push(setTimeout(fin, 700)); };
    let r;
    try {
      r = new SR();
      r.lang = 'en-US'; r.continuous = false; r.interimResults = true; r.maxAlternatives = 5;
    } catch (e) { return res({ heard, err: 'unavailable' }); }
    const tNone = setTimeout(fin, 5000);        // tier C: silence
    const tCap = setTimeout(stop, 12000);
    timers.push(tNone, tCap);
    r.onresult = ev => {
      try {
        for (let i = 0; i < ev.results.length; i++) for (let j = 0; j < ev.results[i].length; j++) {
          const s = (ev.results[i][j].transcript || '').trim();
          if (s && !heard.includes(s)) (j === 0 ? heard.unshift(s) : heard.push(s));
        }
      } catch (e) {}
      if (!heard.length) return;
      clearTimeout(tNone); clearTimeout(tSil);
      tSil = setTimeout(stop, 1600); timers.push(tSil);
      if (!waitAll && !tHit && isMatch(heard)) { tHit = setTimeout(stop, 600); timers.push(tHit); }
    };
    r.onerror = ev => { err = (ev && ev.error) || 'error'; if (err !== 'no-speech' && err !== 'aborted') fin(); };
    r.onend = fin;
    try { r.start(); rec = { abort: fin }; } catch (e) { err = 'unavailable'; fin(); }
  });
}
const stopRec = () => { if (rec) rec.abort(); };

// ---------- stage: emoji actors moved by CSS ----------
const stage = $('stage'), cap = $('cap');
const MARIO = '🤠';
let actors = {};
function showCap(t) { cap.textContent = t || ''; cap.style.display = t ? 'block' : 'none'; }
function fitStage() { stage.style.fontSize = Math.max(34, Math.min(stage.clientWidth, stage.clientHeight * 1.3) * 0.14) + 'px'; }
// cast entry: [emoji, x%, y%, size(em), cssFilter]
function addActor(k, e, x, y, s, f, pop) {
  if (actors[k]) actors[k].remove();
  const el = document.createElement('div');
  el.className = 'actor' + (pop ? ' pop' : '');
  el.style.left = x + '%'; el.style.top = y + '%'; el.style.fontSize = (s || 1) + 'em';
  if (f) el.style.filter = f;
  const i = document.createElement('span'); i.className = 'in'; i.textContent = e;
  el.appendChild(i); stage.appendChild(el); actors[k] = el;
}
function setStage(card) {
  stage.querySelectorAll('.actor,.conf').forEach(n => n.remove());
  actors = {};
  stage.className = 'bg-' + (card.bg || 'grass');
  const cast = Object.assign({ m: [MARIO, 14, 74, 1.15] }, card.cast);
  for (const k in cast) if (cast[k]) addActor(k, ...cast[k]);
  fitStage();
}
function bubble(el, t) {
  const b = document.createElement('span'); b.className = 'bub'; b.textContent = t;
  el.appendChild(b); timers.push(setTimeout(() => b.remove(), 1500));
}
function rain(chars) {                 // falling emoji effect, e.g. '💧💦' or '🎉✨'
  const set = Array.from(chars);
  for (let i = 0; i < 14; i++) {
    const c = document.createElement('span'); c.className = 'conf'; c.textContent = pick(set);
    c.style.left = (4 + rnd(92)) + '%'; c.style.animationDelay = (rnd(6) / 10) + 's';
    stage.appendChild(c); timers.push(setTimeout(() => c.remove(), 2600));
  }
}
/* one step = any subset of: at(ms) k(actor) x y s(size) r(rotate) o(opacity)
   f(filter) e(swap emoji) an(keyframe) bub(text) add[emoji,x,y,s] bg fx d(ms) */
function applyStep(st) {
  if (st.bg) stage.className = 'bg-' + st.bg;
  if (st.fx) rain(st.fx);
  if (!st.k) return;
  if (st.add) return addActor(st.k, st.add[0], st.add[1], st.add[2], st.add[3], '', true);
  const el = actors[st.k]; if (!el) return;
  if (st.d) el.style.setProperty('--d', st.d + 'ms');
  if (st.x != null) el.style.left = st.x + '%';
  if (st.y != null) el.style.top = st.y + '%';
  if (st.s != null) el.style.fontSize = st.s + 'em';
  if (st.r != null) el.style.setProperty('--r', st.r + 'deg');
  if (st.o != null) el.style.opacity = st.o;
  if (st.f != null) el.style.filter = st.f;
  if (st.e) el.firstChild.textContent = st.e;
  if (st.an) { const i = el.firstChild; i.className = 'in'; void i.offsetWidth; i.className = 'in an-' + st.an; }
  if (st.bub) bubble(el, st.bub);
}
const stepsLen = steps => steps.reduce((m, st) => Math.max(m, (st.at || 0) + (st.d || 800)), 0) + 500;
function playSteps(steps) {
  steps.forEach(st => timers.push(setTimeout(() => applyStep(st), st.at || 0)));
  return sleep(stepsLen(steps));
}
const anim = (k, an) => applyStep({ k, an });

// step builders (keep the card table short)
const A = (k, an, at = 0) => ({ k, an, at });                       // keyframe animation
const M = (k, x, y, at = 0, d = 700) => ({ k, x, y, at, d });       // move
const P = (k, e, x, y, s = 1, at = 0) => ({ k, add: [e, x, y, s], at }); // pop in a new actor
const B = (k, bub, at = 0) => ({ k, bub, at });                     // little bubble (sound effect / emoji only)
const X = (k, at = 0) => ({ k, o: 0, at });                         // vanish
const Z = (k, s, at = 0, d = 600) => ({ k, s, at, d });             // resize
const R = (k, r, at = 0) => ({ k, r, at });                         // rotate
const FL = (k, f, at = 0) => ({ k, f, at });                        // css filter
const G = (bg, at = 0) => ({ bg, at });                             // background
const F = (fx, at = 0) => ({ fx, at });                             // emoji rain

/* =====================================================================

/* =====================================================================
   GAME — state machine
   home → (startRound) → busy:prompt → ready → listen → A: result → next
                                         ↑        ├ B: hint ladder ─┘ (back to ready)
                                         └────────┴ C: re-read prompt
   Every await is followed by a `gen` check, so exiting mid-card can never
   leave a stale callback running.
   ===================================================================== */
const game = { gen: 0, state: 'home', deck: [], i: 0, card: null, miss: 0, sil: 0, t0: 0, spoke: 0, got: [] };

// ---- deck: T 3–4, C 2–3, X 2, R 1; no 3 of a type in a row; E ~15%; card 30 always last ----
function drawDeck() {
  // least-passed cards first (with jitter); a skipped card was never counted, so it stays in the pool
  const take = (t, n) => CARDS.filter(c => c.t === t && c.id !== 30)
    .map(c => [c, (prog.plays[c.id] || 0) + Math.random() * 1.5]).sort((a, b) => a[1] - b[1]).slice(0, n).map(x => x[0]);
  let deck = [].concat(take('T', 3 + rnd(2)), take('C', 2 + rnd(2)), take('X', 2), take('R', 1));
  const ok = d => !d.some((c, i) => i > 1 && c.t === d[i - 1].t && c.t === d[i - 2].t);
  for (let n = 0; n < 200; n++) { deck = shuffle(deck); if (ok(deck)) break; }
  if (Math.random() < 0.15) deck.splice(1 + rnd(deck.length - 1), 0, take('E', 1)[0]);
  deck.push(byId[30]);
  return deck;
}
function renderDots() {
  $('dots').innerHTML = game.deck.map((c, i) => '<i class="' + (i < game.i ? 'done' : '') + '"></i>').join('');
}

function startRound() {
  unlockTTS();
  game.gen++; clearTimers();
  Object.assign(game, { deck: drawDeck(), i: 0, spoke: 0, got: [] });
  show('play'); nextCard();
}
function nextCard() {
  if (game.i >= game.deck.length) return endRound();
  const card = game.card = game.deck[game.i];
  game.miss = 0; game.sil = 0;
  hintEl.innerHTML = ''; showKeys(false); renderDots();
  setStage(card);
  if (card.pre) playSteps(card.pre);         // staging that happens while Mario talks
  sayPrompt(true);
}
// Mario reads the prompt; the mic only becomes available after TTS has finished
async function sayPrompt(fresh) {
  const gen = game.gen;
  game.state = 'busy'; mic.disabled = again.disabled = true; mic.className = '';
  anim('m', 'talk');
  await speak(game.card.say);
  if (gen !== game.gen) return;
  ready(fresh);
}
function ready(fresh) {
  game.state = 'ready';
  if (fresh) game.t0 = Date.now();
  if (actors.m) actors.m.firstChild.className = 'in';
  mic.disabled = !micOK; mic.className = micOK ? 'ready' : ''; again.disabled = false;
  if (!micOK) showKeys();                    // no microphone: the whole round runs on parent confirm
}

// ---- mic: one tap starts, silence ends (a second tap also ends) ----
mic.onclick = async () => {
  if (game.state === 'listen') return stopRec();
  if (game.state !== 'ready' || !micOK) return;
  const gen = game.gen, card = game.card;
  game.state = 'listen'; mic.className = 'live'; again.disabled = true; hush(); showCap('');
  const { heard, err } = await listen(h => passes(card, h), card.waitAll || card.any);
  if (gen !== game.gen) return;
  mic.className = '';
  const ms = Date.now() - game.t0;
  if (err && err !== 'no-speech' && err !== 'aborted' && !heard.length) {      // recogniser broken / blocked → degrade, never dead-end
    if (err !== 'network') micOK = false;
    logTry(card.id, 'C', [], ms, 'err:' + err);
    showKeys(); return ready();
  }
  if (!heard.length) return tierC(card, ms);
  if (passes(card, heard)) return pass(card, heard, 'A', ms);
  tierB(card, heard, ms);
};
again.onclick = () => { if (game.state === 'ready') sayPrompt(false); };

// C — silence: not counted; the 5 s wait already happened inside listen(), so just re-read the prompt
function tierC(card, ms) {
  logTry(card.id, 'C', [], ms, '');
  if (++game.sil >= 3) showKeys();           // safety net so a silent child is never stuck (see BUILD-NOTES)
  sayPrompt(false);
}
// B — spoke but no keyword: 1) light reaction 2) icons + one demo word 3) the two keys
async function tierB(card, heard, ms) {
  const gen = game.gen; game.miss++; game.state = 'busy'; mic.disabled = true;
  logTry(card.id, 'B', heard, ms, '');
  anim(lead(), 'wob'); anim('m', 'talk');
  if (game.miss === 2) {
    const d = pick(card.opts);
    hintEl.innerHTML = '';
    card.opts.forEach(o => {
      const el = document.createElement('span'); el.className = 'ic' + (o === d ? ' demo' : ''); el.textContent = o[0];
      if (o[2]) el.style.fontSize = 36 * o[2] + 'px';
      hintEl.appendChild(el);
    });
    let demo = d[1];
    if (card.crib) {                         // R cards: the crib line appears only now, as the 2nd hint
      const el = document.createElement('span'); el.className = 'crib'; el.textContent = card.crib; hintEl.appendChild(el);
      demo = card.crib.replace('___.', d[1] + 's!');
    }
    await speak('You can say: ' + demo);
  } else {
    if (game.miss >= 3) showKeys();
    const justNo = card.t === 'X' && norm(heard[0]).includes('no');           // X cards: "no" alone is not enough
    await speak(justNo ? 'No? Tell me!' : 'Hmm?');
  }
  if (gen !== game.gen) return;
  ready();
}

// ---- outcome: by the child's word, or random without repeating last time; ~10% rare ----
function choose(card, hits, heard) {
  const last = prog.last[card.id];
  let key, parts, r = card.r, rare = false, echo = '';
  if (card.dyn) {
    const o = card.dyn(hits, last, heard);
    key = o.key; parts = [o.s]; r = o.r || r; echo = o.echo || '';
  } else {
    const ks = [];
    if (card.pick === 'word') hits.forEach(h => { const k = (card.map && card.map[h]) || h; if (card.out[k] && !ks.includes(k)) ks.push(k); });
    if (ks.length > 1 && card.out.both) key = 'both';
    else if (ks.length > 1 && card.both) key = ks[0] + '+' + ks[1];
    else if (ks.length) key = ks[0];
    else {                                   // random card, or parent confirm on a word card
      const all = Object.keys(card.out).filter(k => k !== card.rareKey), pool = all.filter(k => k !== last);
      key = pick(pool.length ? pool : all);
    }
    const seq = key.split('+').filter(k => card.out[k]);
    parts = seq.map(k => card.out[k].s);
    r = card.out[seq[seq.length - 1]].r || r;
  }
  if (card.rareKey === key) rare = true;
  let plus = null;
  if (!rare && card.rare && Math.random() < 0.1) {
    rare = true;
    if (card.rare.plus) plus = card.rare.plus;
    else { parts = [card.rare.s]; r = card.rare.r || r; key = 'rare'; }
  }
  return { key, parts, plus, r, rare, echo };
}

// ---- A tier or parent confirm: full result animation → reply → sticker → next ----
async function pass(card, heard, via, ms) {
  const gen = game.gen;
  game.state = 'busy'; mic.disabled = again.disabled = true; mic.className = '';
  hintEl.innerHTML = ''; showKeys(false); showCap('');
  const o = choose(card, via === 'A' ? findKws(heard, card.kw, WHITELIST[card.id]) : [], heard);
  logTry(card.id, via, heard, ms, o.key + (o.rare ? '*' : ''));
  const isNew = !prog.st[card.id];
  prog.last[card.id] = o.key;
  prog.plays[card.id] = (prog.plays[card.id] || 0) + 1;
  prog.st[card.id] = Math.max(prog.st[card.id] || 0, o.rare ? 2 : 1);
  saveProg();
  game.spoke++; game.got.push({ icon: card.icon, isNew, shiny: o.rare });

  for (let i = 0; i < o.parts.length; i++) {
    if (i) setStage(card);                   // "both": second outcome starts from a fresh stage
    await playSteps(o.parts[i]);
    if (gen !== game.gen) return;
  }
  if (o.plus) { await playSteps(o.plus); if (gen !== game.gen) return; }
  if (o.echo) { anim('a', 'talk'); await speak(o.echo, { pitch: 1.9, rate: 1.05 }); }   // parrot card
  else { anim('m', 'talk'); await speak(o.r); }
  if (gen !== game.gen) return;
  await flySticker(card, o.rare);
  if (gen !== game.gen) return;
  game.i++; nextCard();
}
async function flySticker(card, shiny) {
  const f = $('fly'), a = stage.getBoundingClientRect(), b = $('bookIco').getBoundingClientRect();
  f.textContent = card.icon + (shiny ? '✨' : '');
  f.style.cssText = 'display:block;transition:none;opacity:1;transform:scale(1.5);left:' + (a.left + a.width / 2 - 32) + 'px;top:' + (a.top + a.height / 2 - 32) + 'px';
  await sleep(450);
  f.style.transition = 'left .7s ease-in,top .7s ease-in,transform .7s ease-in,opacity .2s linear .55s';
  f.style.left = b.left + 'px'; f.style.top = b.top + 'px'; f.style.transform = 'scale(.4)'; f.style.opacity = '0';
  await sleep(800);
  f.style.display = 'none';
}

// ---- the two fallback keys ----
// child's Skip: no result, no sticker, card goes back to the pool, nothing recorded as a failure
$('skip').onclick = () => {
  if (game.state !== 'ready') return;
  logTry(game.card.id, 'skip', [], Date.now() - game.t0, '');
  game.i++; nextCard();
};
// grown-up holds 1 s: counts as a pass, logged as "parent"
let holdT = 0;
const holdEnd = () => { clearTimeout(holdT); holdT = 0; heardBtn.classList.remove('hold'); };
heardBtn.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  if (game.state !== 'ready' || holdT) return;
  heardBtn.classList.add('hold');
  holdT = setTimeout(() => { holdEnd(); if (game.state === 'ready') pass(game.card, [], 'parent', Date.now() - game.t0); }, 1000);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(e => heardBtn.addEventListener(e, holdEnd));
document.addEventListener('contextmenu', ev => ev.preventDefault());

// ---- leaving / ending ----
function stopAll() { game.gen++; holdEnd(); clearTimers(); stopRec(); hush(); showCap(''); $('fly').style.display = 'none'; }
function endRound() {
  stopAll(); game.state = 'end';
  $('nSpoke').textContent = game.spoke;      // A tier + parent confirm only
  $('nStick').textContent = game.got.length;
  $('endRow').innerHTML = '';
  game.got.forEach(g => { const s = document.createElement('span'); s.textContent = g.icon + (g.shiny ? '✨' : ''); if (g.isNew || g.shiny) s.className = 'new'; $('endRow').appendChild(s); });
  show('end');
  speak('Great job!');
}
function goHome() { stopAll(); game.state = 'home'; $('nomic').style.display = micOK ? 'none' : 'block'; show('home'); }
$('exit').onclick = () => (game.spoke ? endRound() : goHome());
$('start').onclick = $('replay').onclick = startRound;
$('toHome').onclick = $('closeBook').onclick = goHome;

// ---- sticker book: lit / unlit / shiny, no numbers ----
$('openBook').onclick = () => {
  $('grid').innerHTML = '';
  CARDS.forEach(c => { const d = document.createElement('div'); d.textContent = c.icon; d.className = prog.st[c.id] === 2 ? 'lit shiny' : prog.st[c.id] ? 'lit' : ''; $('grid').appendChild(d); });
  show('book');
};

// ---- parent menu (second level): reset progress, copy log ----
const pmsg = $('pmsg'), pText = $('pText');
$('gear').onclick = () => { pmsg.textContent = ''; pText.style.display = 'none'; $('parent').classList.add('on'); };
$('pClose').onclick = () => $('parent').classList.remove('on');
$('pReset').onclick = () => {
  if (!window.confirm('清空全部贴纸和进度？（日志保留）')) return;
  prog = { st: {}, last: {}, plays: {} }; saveProg(); pmsg.textContent = '已重置。';
};
$('pCopy').onclick = async () => {
  const t = logText(), n = t.split('\n').length - 1;
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch (e) {}
  pText.value = t; pText.style.display = 'block';
  if (!ok) { try { pText.focus(); pText.select(); ok = document.execCommand('copy'); } catch (e) {} }
  pmsg.textContent = ok ? '已复制 ' + n + ' 条日志。' : '自动复制失败，请长按下方文本框全选复制（共 ' + n + ' 条）。';
};

// ---- boot ----
window.addEventListener('resize', fitStage);
document.addEventListener('visibilitychange', () => { if (document.hidden) { stopRec(); hush(); } });
$('nomic').style.display = micOK ? 'none' : 'block';
</script>
</body>
