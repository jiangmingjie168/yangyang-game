<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Word Check 摸底</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:-apple-system,"SF Pro Rounded","Helvetica Neue",Arial,sans-serif;background:#fff6dc;color:#3a2a14}
body{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:4px 0 2px}
.sub{font-size:15px;line-height:1.5;margin:0 0 10px}
#nosr{display:none;background:#ffe1de;border:2px solid #e5383b;border-radius:16px;padding:14px;font-size:17px;font-weight:700;margin:10px 0}
#sum{position:sticky;top:0;z-index:5;background:#fff;border-radius:16px;box-shadow:0 3px 0 #e2cf9a;padding:10px 14px;font-size:16px;font-weight:700;margin-bottom:10px}
#sum small{display:block;font-weight:400;font-size:13px;color:#8a6d3b;word-break:break-all}
#sum .red{color:#c81e1e}
.btns{display:flex;gap:10px;margin-bottom:12px}
.btns button{flex:1;padding:12px;border-radius:14px;border:0;background:#fff;box-shadow:0 3px 0 #e2cf9a;font-size:16px;font-weight:700;cursor:pointer}
h2{font-size:20px;margin:16px 0 8px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 0 #e2cf9a}
.row.testing{outline:3px solid #ff8a3d}
.row.low{border:2px solid #e5383b}
.row .w{font-size:22px;font-weight:800;min-width:96px;word-break:break-all}
.row .w .star{font-size:14px;color:#e6a700}
.row .say{flex:none;font-size:16px;font-weight:800;padding:10px 14px;border-radius:999px;border:0;background:#ff8a3d;color:#fff;cursor:pointer}
.row .say[disabled]{opacity:.35}
.row .res{flex:1;font-size:13px;line-height:1.45;min-width:0;word-break:break-word}
.row .res .att{margin:2px 0}
.row .res .tr{color:#6b5a3e}
.rate{font-weight:800;font-size:16px}
.rate.ok{color:#2a7d2a}.rate.low{color:#c81e1e}
.tag{font-size:12px;font-weight:700;color:#c81e1e}
#pmsg{min-height:18px;font-size:13px;color:#2a7d2a;margin-top:4px}
#copyText{width:100%;height:120px;display:none;font-size:11px;margin-top:6px;-webkit-user-select:text;user-select:text}
.hint{font-size:13px;color:#8a6d3b;margin:2px 0 0}
</style>
</head>
<body>
<h1>🎤 Word Check</h1>
<p class="sub">说两遍，测一测 iPhone 听不听得懂。<br>Tap ▶, listen, then say the word. Two tries per word.<br>重点词置顶：moo、quack、sheep 最容易翻车，先测。</p>
<div id="nosr">⚠️ 此浏览器不支持语音识别，请用 Safari 打开。<br>This browser can't do speech recognition. Please open in Safari.</div>
<div id="sum">—<small></small></div>
<div class="btns">
  <button id="copyBtn">📋 复制结果 Copy results</button>
  <button id="resetBtn">🗑 重置 Reset</button>
</div>
<div id="pmsg"></div>
<textarea id="copyText" readonly></textarea>
<h2>⭐ 重点测 · Focus words</h2>
<div id="plist"></div>
<h2>全部关键词 · All words (<span id="totalN"></span>)</h2>
<div id="list"></div>

<script>
'use strict';
/* Word Check — recognition probe for the speaking-cards prototype.
   Word list = distinct `kw` values from the prototype's CARDS array
   (including the kwOf animal/colour expansions), extracted 2026-11-14.
   Matching logic is identical to the prototype (norm + synonyms + phrases),
   so probe results predict prototype behaviour. */

// ---------- word list (do not hand-edit: regenerate from CARDS if the table changes) ----------
const WORDS = ["apple","away","baby","banana","bath","bear","bee","big","bird","black","blue","both","brown","butterfly","bye","cake","carrot","cat","chicken","clean","come","come out","cow","crab","crocodile","dinosaur","dog","dolphin","down","dragon","duck","ducks","eat","egg","elephant","fast","fish","fly","fox","frog","get up","giraffe","go","goat","goodbye","gray","green","grey","hello","here","hide","hippo","hop","horse","jump","kangaroo","kitty","koala","lion","little","long","look","monkey","moo","morning","mouse","octopus","open","orange","out","owl","panda","parrot","penguin","pig","pink","purple","quack","rabbit","rainbow","red","rooster","run","sea","see you","shark","sheep","shoo","shower","sit","sleep","slide","snail","snake","spider","splash","stop","swim","tall","tiger","turtle","unicorn","up","wake","wash","water","whale","white","wolf","yellow","zebra"];
const PRIORITY = ['moo', 'quack', 'sheep'];

// ---------- matching: identical to the prototype ----------
const SYN = { bunny: 'rabbit', bunnies: 'rabbit', kitty: 'cat', kitten: 'cat', doggy: 'dog', doggie: 'dog', puppy: 'dog',
  mice: 'mouse', butterflies: 'butterfly', puppies: 'dog', kitties: 'cat', wolves: 'wolf' };
const norm = s => String(s || '').toLowerCase().replace(/[^a-z' ]+/g, ' ').replace(/'/g, '').trim().split(/\s+/).filter(Boolean).map(t => SYN[t] || t);
const tokIs = (t, k) => t === k || t === k + 's' || t === k + 'es' || t === k + 'ing' || t === k + k.slice(-1) + 'ing';
function hasKw(toks, kw) {
  const ks = kw.split(' ');
  for (let i = 0; i + ks.length <= toks.length; i++) if (ks.every((k, j) => tokIs(toks[i + j], k))) return true;
  return false;
}
const heardHits = (heard, word) => heard.some(h => hasKw(norm(h), word));

// ---------- storage ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const K_WORDS = 'probe_words_v1', K_LOG = 'probe_log_v1';
let words = store.get(K_WORDS, {});   // word -> [{t, said, alts, hit}]
const saveWords = () => store.set(K_WORDS, words);
function logAttempt(word, n, said, alts, hit) {
  const log = store.get(K_LOG, []);
  log.push({ t: new Date().toISOString(), word, n, said: said || '', alts: alts || [], hit: !!hit });
  store.set(K_LOG, log.slice(-3000));
}

// ---------- TTS (same shape as the prototype) ----------
const synth = window.speechSynthesis || null;
let ttsFailed = !synth || typeof window.SpeechSynthesisUtterance !== 'function';
function speak(text) {
  if (ttsFailed) return new Promise(r => setTimeout(r, 900 + text.length * 55));
  return new Promise(res => {
    let done = false;
    const fin = () => { if (done) return; done = true; res(); };
    try {
      if (synth.speaking || synth.pending) synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.9;
      const v = (synth.getVoices() || []).find(v => /^en[-_]US/i.test(v.lang));
      if (v) u.voice = v;
      u.onend = fin; u.onerror = fin;
      synth.speak(u);
      setTimeout(fin, 2500 + text.length * 110);
    } catch (e) { ttsFailed = true; fin(); }
  });
}

// ---------- recognition (same shape as the prototype's listen) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const srOK = !!SR;
function listen() {
  return new Promise(res => {
    const heard = []; let done = false, err = '', tSil = 0;
    let r;
    const fin = () => {
      if (done) return; done = true;
      [tNone, tCap, tSil].forEach(clearTimeout);
      try { r.onresult = r.onerror = r.onend = null; r.abort(); } catch (e) {}
      res({ heard, err });
    };
    const stop = () => { try { r.stop(); } catch (e) {} setTimeout(fin, 700); };
    try {
      r = new SR();
      r.lang = 'en-US'; r.continuous = false; r.interimResults = true; r.maxAlternatives = 5;
    } catch (e) { return res({ heard, err: 'unavailable' }); }
    const tNone = setTimeout(fin, 5000);
    const tCap = setTimeout(stop, 12000);
    r.onresult = ev => {
      try {
        for (let i = 0; i < ev.results.length; i++) for (let j = 0; j < ev.results[i].length; j++) {
          const s = (ev.results[i][j].transcript || '').trim();
          if (s && !heard.includes(s)) (j === 0 ? heard.unshift(s) : heard.push(s));
        }
      } catch (e) {}
      if (!heard.length) return;
      clearTimeout(tNone); clearTimeout(tSil);
      tSil = setTimeout(stop, 1600);
    };
    r.onerror = ev => { err = (ev && ev.error) || 'error'; if (err !== 'no-speech' && err !== 'aborted') fin(); };
    r.onend = fin;
    try { r.start(); } catch (e) { err = 'unavailable'; fin(); }
  });
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
let testing = null;   // word currently being tested (one at a time)
function rateOf(word) {
  const a = words[word] || [];
  if (!a.length) return null;
  return a.filter(x => x.hit).length / a.length;
}
function rowEl(word, priority) {
  const row = document.createElement('div');
  row.className = 'row'; row.dataset.w = word;
  const w = document.createElement('div'); w.className = 'w';
  w.innerHTML = (priority ? '<span class="star">★重点测</span><br>' : '') + word.replace(/</g, '&lt;');
  const btn = document.createElement('button'); btn.className = 'say'; btn.textContent = '▶ 说';
  btn.disabled = !srOK;
  btn.onclick = () => testWord(word);
  const res = document.createElement('div'); res.className = 'res';
  row.append(w, btn, res);
  return row;
}
function paintRow(word) {
  document.querySelectorAll('.row[data-w="' + CSS.escape(word) + '"]').forEach(row => {
    const a = words[word] || [];
    const res = row.querySelector('.res'), btn = row.querySelector('.say');
    row.classList.toggle('testing', testing === word);
    const done = a.length >= 2;
    const rate = rateOf(word);
    row.classList.toggle('low', done && rate !== null && rate < 0.7);
    res.innerHTML = '';
    a.forEach((x, i) => {
      const d = document.createElement('div'); d.className = 'att';
      d.innerHTML = (i + 1) + '. ' + (x.hit ? '✅' : '❌') + ' <span class="tr">“' + (x.said || '（没听到）').replace(/</g, '&lt;') + '”' +
        (x.alts && x.alts.length ? ' | 备选：' + x.alts.join(' / ').replace(/</g, '&lt;') : '') + '</span>';
      res.appendChild(d);
    });
    if (done && rate !== null) {
      const r = document.createElement('div');
      r.innerHTML = '<span class="rate ' + (rate >= 0.7 ? 'ok' : 'low') + '">' + Math.round(rate * 100) + '%</span>' +
        (rate < 0.7 ? ' <span class="tag">低于七成：换词或进白名单</span>' : '');
      res.appendChild(r);
    }
    btn.textContent = testing === word ? '🎤 听着…' : done ? '↻ 重测' : a.length === 1 ? '▶ 再说一遍 (1/2)' : '▶ 说';
    btn.disabled = !srOK || (testing !== null && testing !== word);
  });
}
function paintAll() {
  WORDS.forEach(paintRow);
  const tested = WORDS.filter(w => (words[w] || []).length >= 2);
  const done = WORDS.filter(w => (words[w] || []).length >= 1);
  const hits = WORDS.reduce((n, w) => n + (words[w] || []).filter(x => x.hit).length, 0);
  const total = WORDS.reduce((n, w) => n + (words[w] || []).length, 0);
  const low = tested.filter(w => rateOf(w) < 0.7);
  $('sum').innerHTML = '已测 ' + done.length + '/' + WORDS.length + ' 词 · 完成两遍 ' + tested.length + ' 个 · 命中率 ' + (total ? Math.round(hits / total * 100) + '%' : '—') +
    (low.length ? ' · <span class="red">低于七成 ' + low.length + ' 个</span>' : '') +
    '<small>' + (low.length ? '低于七成：' + low.join(', ') : '点 ▶ 开始，先测置顶的三个重点词。') + '</small>';
}
async function testWord(word) {
  if (testing || !srOK) return;
  if ((words[word] || []).length >= 2) words[word] = [];   // retest: start over
  testing = word;
  paintAll();
  await speak(word);                                       // TTS first, mic only after it finishes
  const { heard, err } = await listen();
  testing = null;
  if (err && err !== 'no-speech' && err !== 'aborted' && !heard.length) {
    // recogniser broken/blocked: do not record an attempt, say so plainly
    $('pmsg').textContent = '识别出错（' + err + '），这次不计。检查麦克风权限或换 Safari 试试。';
    paintAll();
    return;
  }
  const said = heard[0] || '', alts = heard.slice(1);
  const hit = heard.length > 0 && heardHits(heard, word);
  (words[word] = words[word] || []).push({ t: new Date().toISOString(), said, alts, hit });
  saveWords();
  logAttempt(word, words[word].length, said, alts, hit);
  $('pmsg').textContent = '';
  paintAll();
}

// ---------- copy / reset ----------
function resultText() {
  const lines = ['word\trate\tattempts'];
  WORDS.forEach(w => {
    const a = words[w] || [];
    lines.push(w + '\t' + (a.length ? Math.round(a.filter(x => x.hit).length / a.length * 100) + '%' : '—') + '\t' + a.length);
  });
  lines.push('', 'time\tword\tattempt\ttranscript\talternatives\thit');
  store.get(K_LOG, []).forEach(e => lines.push([e.t, e.word, e.n, e.said, (e.alts || []).join(' | '), e.hit ? 'yes' : 'no'].join('\t')));
  return lines.join('\n');
}
$('copyBtn').onclick = async () => {
  const t = resultText(), n = store.get(K_LOG, []).length;
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch (e) {}
  const ta = $('copyText'); ta.value = t; ta.style.display = 'block';
  if (!ok) { try { ta.focus(); ta.select(); ok = document.execCommand('copy'); } catch (e) {} }
  $('pmsg').textContent = ok ? '已复制（' + n + ' 条尝试记录）。' : '自动复制失败，请长按下方文本框全选复制（' + n + ' 条）。';
};
$('resetBtn').onclick = () => {
  if (!window.confirm('清空全部摸底记录？')) return;
  words = {}; saveWords(); store.set(K_LOG, []);
  $('pmsg').textContent = '已重置。'; paintAll();
};

// ---------- boot ----------
$('totalN').textContent = WORDS.length;
PRIORITY.forEach(w => $('plist').appendChild(rowEl(w, true)));
WORDS.forEach(w => $('list').appendChild(rowEl(w, false)));
if (!srOK) {
  $('nosr').style.display = 'block';
  document.querySelectorAll('.say').forEach(b => b.disabled = true);
}
paintAll();
</script>
</body>
</html>
